name: tawafuq
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  image_picker: ^1.1.2
  device_info_plus: ^13.2.0
  geolocator: ^14.0.3
  google_sign_in: ^7.2.0
  shared_preferences: ^2.3.2
  geocoding: ^3.0.0
  google_mlkit_text_recognition: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    # Images
    - assets/images/logo_tawafuq.png
    - assets/images/google_logo.png.webp

    # Avatars
    - assets/avatars/female/
    - assets/avatars/male/

# ============================================================
# Flutter Launcher Icons
# ============================================================

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/logo_tawafuq.png"

  adaptive_icon_background: "#FAF7F2"

  adaptive_icon_foreground: "assets/images/logo_tawafuq.png"